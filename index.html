<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="description" content="InventoryKu: form operasional kitchen.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="InventoryKu">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>InventoryKu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B1F3A'/%3E%3Cg fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 9a2 2 0 0 1 2-2h14v16H10a2 2 0 0 0-2 2z' stroke='%23FFFFFF'/%3E%3Cpath d='M8 25a2 2 0 0 0 2 2h14v-4' stroke='%23FFFFFF'/%3E%3Cpath d='M14 7h4v7l-2-1.5-2 1.5z' fill='%23F2A93B' stroke='%23F2A93B' stroke-width='1'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="./icons/ikon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- Layar tanpa sesi: Login, Pemasangan pertama, Pulihkan akses Pengelola -->
  <div id="masuk" class="masuk" hidden></div>

  <!-- Aplikasi setelah masuk: bar navy, pita sinyal, isi layar -->
  <div id="aplikasi" class="aplikasi" hidden>
    <header class="bar" id="bar">
      <div class="bar-isi">
        <a class="merek" href="#/" aria-label="InventoryKu, ke Beranda">
          <svg class="ikon-buku" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path class="ikon-buku-sampul" d="M5 6a1.5 1.5 0 0 1 1.5-1.5H19v12H6.5A1.5 1.5 0 0 0 5 18z"/>
            <path class="ikon-buku-sampul" d="M5 18a1.5 1.5 0 0 0 1.5 1.5H19v-3"/>
            <path class="ikon-buku-pembatas" d="M11 4.5h3v5.25l-1.5-1.1-1.5 1.1z"/>
          </svg>
          <span class="merek-nama">InventoryKu</span>
        </a>
        <h1 class="bar-judul" id="bar-judul"></h1>
        <nav class="menu" id="menu" aria-label="Menu utama">
          <div class="menu-grup" id="menu-grup"></div>
        </nav>
        <span class="sinyal" id="sinyal-bar"></span>
        <button type="button" class="bar-pengguna" id="bar-pengguna" aria-haspopup="dialog"></button>
      </div>
    </header>
    <div class="pita-sinyal" id="pita-sinyal" role="status" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 6.5a9 9 0 0 1 12 0M4.5 9a5.5 5.5 0 0 1 7 0M8 12h.01M2.5 2.5l11 11"/></svg>
      <span>Tidak ada sinyal. Isian disimpan di HP dan dikirim nanti.</span>
    </div>
    <main id="layar" class="layar" tabindex="-1"></main>
  </div>

  <div id="toast-wadah" class="toast-wadah" aria-live="polite" aria-atomic="true"></div>
  <div id="lembar-wadah"></div>

  <noscript>
    <p class="tanpa-js">InventoryKu butuh JavaScript. Nyalakan JavaScript di browser, lalu buka lagi.</p>
  </noscript>
</body>
</html>
