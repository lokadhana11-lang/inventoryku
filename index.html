<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0B1F3A">
  <meta name="description" content="InventoryKu: form operasional kitchen.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="InventoryKu">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>InventoryKu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1F3A'/%3E%3Cpath d='M31 20.5C24.5 16 16 14.6 9 16v31c7-1.4 15.5 0 22 4.5z' fill='%23FFFFFF'/%3E%3Cpath d='M33 20.5C39.5 16 48 14.6 55 16v31c-7-1.4-15.5 0-22 4.5z' fill='%23E3E8EF'/%3E%3Cpath d='M39.5 18.2h7v18l-3.5-2.7-3.5 2.7z' fill='%23F2A93B'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="./icons/ikon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- Layar tanpa sesi: Login, Pemasangan pertama, Pulihkan akses Pengelola -->
  <div id="masuk" class="masuk" hidden></div>

  <!-- Aplikasi setelah masuk: bar navy, pita sinyal, isi layar -->
  <div id="aplikasi" class="aplikasi" hidden>
    <header class="bar" id="bar">
      <div class="bar-isi">
        <a class="merek" href="#/" aria-label="InventoryKu, ke Beranda">
          <span class="lencana lencana-buka" aria-hidden="true">
            <svg class="ikon-buku" viewBox="7 11 50 44" aria-hidden="true" focusable="false">
              <path class="ikon-buku-kiri" d="M31 20.5C24.5 16 16 14.6 9 16v31c7-1.4 15.5 0 22 4.5z"/>
              <path class="ikon-buku-kanan" d="M33 20.5C39.5 16 48 14.6 55 16v31c-7-1.4-15.5 0-22 4.5z"/>
              <path class="ikon-buku-garis" d="M14 25.5c4.5-.4 8.6.6 12.5 2.6M14 31.5c4.5-.4 8.6.6 12.5 2.6M14 37.5c4.5-.4 8.6.6 12.5 2.6"/>
              <path class="ikon-buku-pembatas" d="M39.5 18.2h7v18l-3.5-2.7-3.5 2.7z"/>
            </svg>
          </span>
          <span class="merek-teks" aria-hidden="true">
            <span class="merek-nama">Inventory<span class="merek-ku">Ku</span></span>
            <span class="merek-outlet" id="merek-outlet"></span>
          </span>
        </a>
        <h1 class="bar-judul" id="bar-judul"></h1>
        <nav class="menu" id="menu" aria-label="Menu utama">
          <div class="menu-grup" id="menu-grup"></div>
        </nav>
        <span class="sinyal" id="sinyal-bar"></span>
        <button type="button" class="bar-pengguna" id="bar-pengguna" aria-haspopup="menu" aria-expanded="false"></button>
      </div>
    </header>
    <div class="pita-sinyal" id="pita-sinyal" role="status" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 6.5a9 9 0 0 1 12 0M4.5 9a5.5 5.5 0 0 1 7 0M8 12h.01M2.5 2.5l11 11"/></svg>
      <span>Tidak ada sinyal. Isian disimpan di HP dan dikirim nanti.</span>
    </div>
    <main id="layar" class="layar" tabindex="-1"></main>
  </div>

  <div id="toast-wadah" class="toast-wadah" aria-live="polite" aria-atomic="true"></div>
  <div id="lembar-wadah"></div>

  <noscript>
    <p class="tanpa-js">InventoryKu butuh JavaScript. Nyalakan JavaScript di browser, lalu buka lagi.</p>
  </noscript>
</body>
</html>
